version: 0.2

phases:
  pre_build:
    commands:
      - export AWS_REGION=ap-south-2
      - export REPOSITORY_URI=486542414995.dkr.ecr.ap-south-2.amazonaws.com/verisql
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin 486542414995.dkr.ecr.ap-south-2.amazonaws.com
  build:
    commands:
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .
  post_build:
    commands:
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
